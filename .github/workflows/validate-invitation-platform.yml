name: Validate invitation platform
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/Filament/Resources/**'
      - 'app/Models/**'
      - 'app/Http/**'
      - 'routes/**'
      - 'resources/views/**'
      - 'config/wedding_builder.php'
      - 'tests/Feature/WeddingBuilderTest.php'
      - 'app/Support/**'
      - 'database/migrations/**'
      - 'database/seeders/**'
      - '.github/workflows/validate-invitation-platform.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_sqlite, intl, gd, bcmath
      - name: Check wedding builder JavaScript syntax
        run: |
          node -e "const fs=require('fs'); const src=fs.readFileSync('resources/views/weddings/partials/editor-script.blade.php','utf8').replace(/^<script>\\s*/,'').replace(/\\s*<\\/script>\\s*$/,''); new Function(src); console.log('Builder JavaScript syntax valid');"
      - run: composer install --no-interaction --prefer-dist
      - run: |
          find app database -name '*.php' -print0 | xargs -0 -n1 php -l
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          php artisan migrate --force
          php artisan db:seed --class=EventTypeQuestionSeeder --force
          php artisan route:list --path=admin
          php artisan filament:cache-components
          php artisan view:cache
          for file in storage/framework/views/*.php; do
            if grep -q 'More than an invitation' "$file"; then
              echo "== Compiled wedding homepage =="
              php -l "$file" || true
              nl -ba "$file" | tail -n 75
            fi
          done
          php artisan test --filter=WeddingBuilderTest
