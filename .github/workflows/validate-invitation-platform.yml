name: Validate invitation platform
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/Filament/Resources/**'
      - 'app/Models/**'
      - 'app/Http/**'
      - 'app/Providers/**'
      - 'bootstrap/providers.php'
      - 'config/services.php'
      - '.env.example'
      - 'composer.json'
      - 'composer.lock'
      - 'routes/**'
      - 'resources/views/**'
      - 'public/branding/**'
      - 'public/wedding/royal-burgundy/**'
      - 'public/wedding/royal-burgundy-v3/**'
      - 'scripts/generate_royal_burgundy_assets.py'
      - 'config/wedding_builder.php'
      - 'config/wedding_photos.php'
      - 'config/wedding_curated_themes.php'
      - 'config/wedding_curated_assets.php'
      - 'config/wedding_curated_showcases.php'
      - 'config/wedding_audio.php'
      - 'public/js/wedding-audio.js'
      - 'tests/js/**'
      - 'tests/Feature/**'
      - 'app/Support/**'
      - 'database/migrations/**'
      - 'database/seeders/**'
      - '.github/workflows/validate-invitation-platform.yml'
concurrency:
  group: invitation-platform-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_sqlite, intl, gd, bcmath
      - name: Validate JavaScript for each separate wedding experience
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = [
            'resources/views/weddings/partials/editor-script.blade.php',
            'resources/views/weddings/partials/photo-builder-script.blade.php',
            'resources/views/weddings/themes/royal-v3-script.blade.php',
            'resources/views/weddings/themes/curated-editorial-script.blade.php',
            'resources/views/weddings/partials/audio-builder-script.blade.php',
            'resources/views/weddings/audio/manage.blade.php'
          ];
          const designs = ['burgundy-wax', 'olive-garden', 'painted-orchard', 'pearl-editorial', 'destination-ticket'];
          const files = [...base, ...designs.map(key => 'resources/views/weddings/themes/editorial/intros/'+key+'.blade.php')];
          for (const path of files) {
            const text = fs.readFileSync(path, 'utf8');
            const blocks = [...text.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/g)];
            if (blocks.length !== 1) throw new Error(path+' must contain one JavaScript block; got '+blocks.length);
            new Function(blocks[0][1]);
            console.log(path+' syntax valid');
          }
          NODE
          node --check public/js/wedding-audio.js
          node tests/js/wedding-audio-preview.test.cjs
      - run: composer install --no-interaction --prefer-dist
      - run: |
          find app database -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l config/wedding_curated_assets.php
          php -l config/wedding_curated_themes.php
          php -l config/wedding_curated_showcases.php
          php -l config/wedding_audio.php
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          php artisan migrate --force
          php artisan db:seed --class=EventTypeQuestionSeeder --force
          php artisan route:list --path=admin
          php artisan route:list --path=app
          php artisan filament:cache-components
          php artisan view:cache
          find storage/framework/views -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php artisan test --filter=WeddingBuilderTest
          php artisan test --filter=InvitationFormLayoutTest
          php artisan test --filter=CustomerWorkspaceTest
          php artisan test --filter=MarketingPagesTest
          php artisan test --filter=GoogleLoginTest
          php artisan test --filter=BrandingExperienceTest
          php artisan test --filter=RoyalBurgundyWeddingTest
          php artisan test --filter=CuratedWeddingThemesTest
          php artisan test --filter=WeddingMessageLibraryTest
          php artisan test --filter=GuestRsvpTest
          php artisan test --filter=InvitationPremiumTest
          php artisan test --filter=WeddingAudioTest
