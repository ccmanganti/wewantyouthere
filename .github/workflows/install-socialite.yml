name: Install Laravel Socialite

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-socialite.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, xml, curl, zip, pdo_sqlite, intl, gd, bcmath
      - name: Install and lock Laravel Socialite
        run: |
          composer require laravel/socialite:"^5.0" -W --no-interaction
          composer validate --no-check-publish
      - name: Commit the updated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: install Laravel Socialite for Google OAuth"
            git push origin HEAD:main
          fi
